name: verify

# One run per push (of its head commit), on every branch (task-48). The project works without pull
# requests (docs/git-workflow.md), so a pull_request trigger would only run the same commit twice; tag
# pushes are left out for the same reason. workflow_dispatch reruns a branch by hand.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same feature branch cancels the older run. On main every push gets a group of
# its own (its commit SHA): GitHub replaces a pending run in the same group even without
# cancel-in-progress, and docs/git-workflow.md checks the run of each published main commit.
concurrency:
  group: verify-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TYPST_VERSION: '0.15.1'
  # SHA-256 of the official release assets, from the `digest` GitHub records for each asset of
  # https://github.com/typst/typst/releases/tag/v0.15.1 (gh api repos/typst/typst/releases/tags/v0.15.1),
  # cross-checked against a local download on 2026-10-14. A new Typst version needs both updated.
  TYPST_SHA256_LINUX: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c   # typst-x86_64-unknown-linux-musl.tar.xz
  TYPST_SHA256_WINDOWS: 19ce3551153c2fe7ee9fa2f95208310c8f4d3209fedb699e0333faf8913f6736 # typst-x86_64-pc-windows-msvc.zip

jobs:
  suite:
    name: suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Runner images pinned rather than *-latest: ubuntu-latest moves to Ubuntu 26.04 from
        # 2026-10-19, and an image change should be a deliberate commit, not a surprise red run.
        # Windows because the owner works there: the suite drives scripts/build.ps1 under pwsh and
        # Windows PowerShell 5.1 there (pwsh only on Linux), and the step below runs it on the checkout.
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Typst (Linux, checksummed)
        if: runner.os == 'Linux'
        run: |
          archive="$RUNNER_TEMP/typst.tar.xz"
          curl -fsSL -o "$archive" "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256_LINUX}  $archive" | sha256sum --check --strict -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version

      - name: Install Typst (Windows, checksummed)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'typst.zip'
          Invoke-WebRequest -Uri "https://github.com/typst/typst/releases/download/v$env:TYPST_VERSION/typst-x86_64-pc-windows-msvc.zip" -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:TYPST_SHA256_WINDOWS) { throw "Typst download checksum mismatch: expected $env:TYPST_SHA256_WINDOWS, got $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP 'typst-x86_64-pc-windows-msvc'
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin 'typst.exe') --version

      # One system font the bundled set lacks (DejaVu Sans), so the suite's system-font case proves
      # --ignore-system-fonts here; tests/run.py fails on CI when it finds none. Windows ships its own.
      - name: Install a system font (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          # Every Python dependency, transitive ones included, is pinned with hashes there (TASK-47).
          cache-dependency-path: requirements.lock

      # Compiled from packages/cv-workflow/pyproject.toml; pip checks every hash the file carries.
      - name: Install verification dependencies
        run: pip install -r requirements.lock

      # ruff.toml says what is checked: apps/, scripts/, tests/ and packages/cv-workflow/.
      - name: Lint with ruff
        run: ruff check

      # The workflow tool (tools/workflow/, ADR 0015) on the Bun version pinned there (1.4.2).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: tools/workflow/.bun-version

      # The exact versions in bun.lock, the tool's tests and type check, then the Workflow Model check
      # (docs/workflow, levels 1 and 2) and its generated READMEs, which must match the model (render --check).
      # bash so that a failing line fails the step on Windows too.
      - name: Check the workflow tool and the Workflow Model
        working-directory: tools/workflow
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run check
          bun run render --check

      - name: Run the regression suite
        run: python tests/run.py --output builds/ci

      # The owner's build command on the real checkout (the suite runs it only in a throwaway copy with
      # a cut list): every example in examples/release.json, fonts strict.
      - name: Build the examples with scripts/build.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -OutputDirectory builds/ci-library

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-evidence-${{ runner.os }}
          path: |
            builds/ci/report.json
            builds/ci/**/result.json
            builds/ci/**/diff-*.png
            builds/ci/**/compile.log
            builds/ci/**/page-*.png
            builds/ci/workflow/commands.log
            builds/ci/workflow-model/check.log
            builds/ci/workflow-model/render.log
            builds/ci/build-script/*.log
            builds/ci-library/*.pdf
          if-no-files-found: ignore
