# yaml-language-server: $schema=../../../tools/workflow/schema/stage.schema.json
id: open
name: Open the Envelope
sources: ["docs/guides/client-workflow.md:17-19", "docs/guides/client-workflow.md:29-108", ".claude/skills/new-client/SKILL.md:13-21"]
purpose: >-
  A new client gets one Envelope under private/, a neutral Alias, the
  envelope.json every Meta File copies, and one task record named by the
  Alias, before any question is asked.
entry: A client has written to the owner, and the owner tells the lead, naming the person, the Rank and the Domain.
exit: >-
  private/<envelope>/ holds its Drawers, a README.md that starts with the Alias
  and the intake date, and envelope.json; the client's Backlog.md task exists,
  titled by the Alias.

steps:
  - id: open.arrives
    name: The owner names a new client
    sources: ["docs/guides/client-workflow.md:17-19", ".claude/skills/new-client/SKILL.md:1-3"]
    actor: actor.owner
    action: manual.tell-new-client
    inputs: [art.client-first-message]
    outputs: [art.owner-request]

  - id: open.envelope
    name: Open the Envelope and its Drawers
    sources: ["docs/guides/client-workflow.md:31-37", ".claude/skills/new-client/SKILL.md:13-16"]
    actor: actor.lead
    action: lead.open-envelope
    inputs: [art.owner-request]
    outputs: [art.envelope-drawers]

  - id: open.alias
    name: Give the client an Alias
    sources: ["docs/guides/client-workflow.md:94-98", ".claude/skills/new-client/SKILL.md:16-18", "docs/glossary.md:48"]
    actor: actor.lead
    action: lead.write-alias
    inputs: [art.envelope-drawers]
    outputs: [art.envelope-readme]

  - id: open.envelope-json
    name: Write envelope.json
    sources: ["docs/guides/client-workflow.md:100-108", ".claude/skills/new-client/SKILL.md:18-21"]
    actor: actor.lead
    action: lead.write-envelope-json
    inputs: [art.envelope-readme, art.owner-request, art.glossary]
    outputs: [art.envelope-json]

  # Decision #7 (2026-10-14) names the task and its closing step; no source says
  # when it is created (GAPS.md).
  - id: open.task-create
    name: Create the client's task, by Alias only
    sources: ["docs/proposals/workflow-model.md:60", "docs/guides/client-workflow.md:96-98"]
    actor: actor.lead
    action: lead.create-client-task
    inputs: [art.envelope-readme]
    outputs: [art.client-task]

artifacts:
  - id: art.client-first-message
    name: The client's first message
    sources: ["docs/guides/client-workflow.md:9-10", "docs/guides/client-workflow.md:17-19"]
    format: chat message
    visibility: third-party
    given: true

  - id: art.owner-request
    name: The owner's "new client" in the session
    sources: ["docs/guides/client-workflow.md:17-19", ".claude/skills/new-client/SKILL.md:1-3"]
    format: the owner's message to the lead (name, Rank, Domain)
    visibility: ephemeral

  - id: art.envelope-drawers
    name: The Envelope folder and its first Drawers
    sources: ["docs/guides/client-workflow.md:31-37", ".claude/skills/new-client/SKILL.md:13-16", "docs/glossary.md:49"]
    path: private/<envelope>/
    format: "folders: intake/ (documents/), research/ (reviews/), draft/"
    visibility: private

  - id: art.glossary
    name: The glossary's Domain ids
    sources: ["docs/glossary.md:38", "docs/guides/client-workflow.md:103-104"]
    path: docs/glossary.md
    format: Markdown table
    visibility: public
    given: true

actions:
  - id: manual.tell-new-client
    kind: manual
    name: Tell the lead about a new client
    sources: ["docs/guides/client-workflow.md:17-19"]
    does: The owner tells the lead a new client has arrived, naming the person, the Rank and the Domain.

  - id: lead.open-envelope
    kind: lead
    name: Open the Envelope
    sources: ["docs/guides/client-workflow.md:31-37", ".claude/skills/new-client/SKILL.md:13-16"]
    does: >-
      Creates private/<name>-<rank>/ in the one Envelope tree with README.md,
      intake/ (messages.md, documents/), research/ (reviews/) and draft/;
      never under examples/.

  - id: lead.write-alias
    kind: lead
    name: Write the Alias and intake date
    sources: ["docs/guides/client-workflow.md:94-98", ".claude/skills/new-client/SKILL.md:16-18"]
    does: >-
      Gives the client an Alias client-<yyyy>-<mm>-<nn> and writes it at the
      top of the Envelope's README.md with the date intake started; outside
      private/ the client is only ever the Alias.

  - id: lead.write-envelope-json
    kind: lead
    name: Write envelope.json
    sources: ["docs/guides/client-workflow.md:100-108", ".claude/skills/new-client/SKILL.md:18-21"]
    does: >-
      Writes alias, domain (an id from the glossary's Domain row), candidate
      (the display name) and rank; every Meta File in the Envelope copies it
      and scripts/cv.py render refuses to run without it.

  - id: lead.create-client-task
    kind: lead
    name: Create the client's task
    sources: ["docs/proposals/workflow-model.md:60"]
    does: Creates one Backlog.md task for the client, named by the Alias only, since backlog/ is public.
