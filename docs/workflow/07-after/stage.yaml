# yaml-language-server: $schema=../../../tools/workflow/schema/stage.schema.json
id: after
name: Retention, deletion and closing the record
sources: ["docs/guides/client-workflow.md:330-359", ".claude/skills/new-client/SKILL.md:95-110", "docs/proposals/workflow-model.md:54-60"]
purpose: >-
  Keep a client's data only as long as promised: name stalled clients and
  passed delete-by dates to the owner, honour a request to keep, have the
  owner erase the Envelope and its Google items, and close the client's task.
entry: >-
  The new-client skill runs (the stall and delete-by checks run every time),
  or a client's delete-by date, written at Export, has passed.
exit: >-
  The Envelope is gone from private/ and from the private repository's
  history, the Google items are deleted, and the client's task is closed; or
  envelope.json records the client's request to keep his data.

steps:
  - id: after.stall-check
    name: Name stalled clients to the owner
    sources: [".claude/skills/new-client/SKILL.md:97-100", "docs/guides/client-workflow.md:333-336"]
    actor: actor.lead
    action: skill.new-client
    inputs: [art.envelope-readme]
    outputs: [art.retention-report]
    when: Every time the new-client skill runs.

  - id: after.delete-by-check
    name: Name passed delete-by dates to the owner
    sources: [".claude/skills/new-client/SKILL.md:97-100", ".claude/skills/new-client/SKILL.md:104-108"]
    actor: actor.lead
    action: skill.new-client
    inputs: [art.readme-delete-by]
    outputs: [art.retention-report]
    when: Every time the new-client skill runs.

  # Implicit (named by the handoff's task 5), decided 2026-10-14 (#3): a keep
  # request is a field in envelope.json.
  - id: after.keep-request
    name: The client asks to keep his data
    sources: ["docs/guides/client-workflow.md:164-167", "docs/proposals/workflow-model.md:56", "docs/work/workflow-model/handoff.md:290"]
    actor: actor.client
    action: manual.ask-to-keep
    outputs: [art.keep-request]
    when: The client asks to keep his data beyond the delete-by date.

  - id: after.keep-record
    name: Record the keep request in envelope.json
    sources: ["docs/proposals/workflow-model.md:56", "docs/workflow/GAPS.md:41-44"]
    actor: actor.lead
    action: lead.record-keep-request
    inputs: [art.keep-request]
    outputs: [art.envelope-keep]
    when: The client asked to keep his data.

  - id: after.erase-commands
    name: Hand the owner the history-erase commands
    sources: [".claude/skills/new-client/SKILL.md:105-108", "docs/guides/client-workflow.md:339-345", "docs/guides/client-workflow.md:333-338"]
    actor: actor.lead
    action: lead.fill-erase-commands
    inputs: [art.retention-report]
    outputs: [art.erase-commands]
    when: The delete-by date has passed and envelope.json records no keep request, or the owner decides to delete a client who never reached Export (no consent, dropped out).

  - id: after.delete-google
    name: Delete the Intake Forms, Sheets and script projects
    sources: ["docs/guides/client-workflow.md:333-338", "docs/guides/client-workflow.md:158-159"]
    actor: actor.owner
    action: manual.delete-google-items
    inputs: [art.readme-google-links, art.retention-report]
    when: The client had an Intake Form, and the delete-by date has passed with no keep request recorded, or the owner decides to delete a client who never reached Export (no consent, dropped out).

  - id: after.erase-envelope
    name: Delete the Envelope and erase it from the private history
    sources: ["docs/guides/client-workflow.md:333-359", "docs/preferences.md:69-77", "docs/workflow/GAPS.md:45-48"]
    actor: actor.owner
    action: manual.erase-envelope
    inputs: [art.erase-commands]
    outputs: [art.private-history]
    when: The delete-by date has passed and envelope.json records no keep request, or the owner decides to delete a client who never reached Export (no consent, dropped out).

  # Decision #7 (2026-10-14): the final step, named after.close there.
  - id: after.close
    name: Close the client's task
    sources: ["docs/proposals/workflow-model.md:60", "docs/work/workflow-model/handoff.md:290"]
    actor: actor.lead
    action: lead.close-client-task
    inputs: [art.private-history]
    outputs: [art.client-task]

  - id: after.revision-cleanup
    name: Remove failed or unapproved Revisions
    sources: ["docs/pdf-workflow.md:211-214", "docs/preferences.md:75-77"]
    actor: actor.owner
    action: manual.go-remove-revisions
    when: The owner wants failed or unapproved Revisions removed before the delete-by date.

artifacts:
  - id: art.retention-report
    name: Stalled clients and passed delete-by dates, by Alias
    sources: [".claude/skills/new-client/SKILL.md:97-100", "docs/guides/client-workflow.md:333-336"]
    format: lines in the lead's report to the owner, with the Google links listed in each README.md
    visibility: ephemeral

  - id: art.keep-request
    name: The client's request to keep his data
    sources: ["docs/guides/client-workflow.md:164-167"]
    format: chat message
    visibility: third-party

  - id: art.envelope-keep
    name: envelope.json, the keep request
    sources: ["docs/proposals/workflow-model.md:56"]
    path: private/<envelope>/envelope.json
    format: a field in envelope.json (name not set)
    visibility: private

  - id: art.erase-commands
    name: The filled history-erase commands
    sources: ["docs/guides/client-workflow.md:346-353", ".claude/skills/new-client/SKILL.md:105-108"]
    format: the guide's commands with the Envelope's folder name filled in, in the lead's report
    visibility: ephemeral

  - id: art.private-history
    name: The private repository without the Envelope
    sources: ["docs/guides/client-workflow.md:339-359"]
    format: jimzord12/cvgen-private on GitHub, history rewritten by git filter-repo and force-pushed
    visibility: third-party

actions:
  - id: skill.new-client
    kind: skill
    name: The new-client skill's report to the owner
    sources: [".claude/skills/new-client/SKILL.md:95-110"]
    skill: new-client

  - id: manual.ask-to-keep
    kind: manual
    name: Ask to keep the data
    sources: ["docs/guides/client-workflow.md:164-167"]
    does: The client asks, through the owner, that his details be kept beyond 12 months after delivery.

  - id: lead.record-keep-request
    kind: lead
    name: Record the keep request
    sources: ["docs/proposals/workflow-model.md:56"]
    does: Records the client's keep request as a field in envelope.json, so the delete-by check skips this client.

  - id: lead.fill-erase-commands
    kind: lead
    name: Fill in the erase commands
    sources: [".claude/skills/new-client/SKILL.md:105-108", "docs/guides/client-workflow.md:339-353"]
    does: >-
      Gives the owner the guide's history-erase commands filled in with the
      Envelope's folder name; he runs them, the lead never does.

  - id: manual.delete-google-items
    kind: manual
    name: Delete the Google items
    sources: ["docs/guides/client-workflow.md:336-338"]
    does: The owner deletes each Intake Form, its Sheet and its script project listed in README.md, then empties the Drive Trash.

  - id: manual.erase-envelope
    kind: manual
    name: Erase the Envelope
    sources: ["docs/guides/client-workflow.md:339-359"]
    does: >-
      With git status and git log origin/main.. empty in private/, the owner
      runs the erase in a fresh clone (git filter-repo, force-push), then
      deletes that folder and every clone, private/ included, and clones it
      again.

  - id: lead.close-client-task
    kind: lead
    name: Close the client's task
    sources: ["docs/proposals/workflow-model.md:60"]
    does: Closes the client's Backlog.md task once the Envelope is deleted.

  - id: manual.go-remove-revisions
    kind: manual
    name: Give the go to remove Revisions
    sources: ["docs/pdf-workflow.md:211-214", "docs/preferences.md:69-77"]
    does: The owner gives his explicit go, on the exact command shown first, to remove failed or unapproved Revisions.
