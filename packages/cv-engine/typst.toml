[package]
name = "cvgen"
version = "0.1.0"
entrypoint = "lib.typ"
authors = ["Dimitrios Stamatakis"]
license = "MIT"
description = "CVgen: composable Typst CV library for any field, organised by domain, role and template over independent candidate data, theme, artwork pack and layout profile."
compiler = "0.15.1"
# Paths are relative to this package folder. The frozen design reference under
# domains/marine/templates/flagship/tests/approved is excluded from the package payload.
exclude = ["domains/marine/templates/flagship/tests"]
