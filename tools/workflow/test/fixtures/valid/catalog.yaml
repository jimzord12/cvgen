  - { id: art.schema, name: Schema, sources: ["packages/cv-workflow/cv_workflow/output.schema.json:1-5"], path: packages/cv-workflow/cv_workflow/output.schema.json, visibility: public, given: true }
  - { id: art.draft, name: Draft, sources: ["AGENTS.md"], path: private/<envelope>/draft.json, schema: art.schema, visibility: private }
